<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impostazioni</title>
  <style>
    /* --- STILI GLOBALI --- */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    /* --- CENTRATURA SCHERMATA --- */
    .schermata {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      flex-direction: column;
    }

    .container {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 350px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    /* --- FORM --- */
    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      background-color: #4CAF50;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.2s;
    }

      button:hover {
        background-color: #45a049;
      }

    /* --- SCHERMATA GRIGLIA --- */
    #grigliaSchermata {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      height: 100vh;
      gap: 10px;
      padding-top: 20px;
      box-sizing: border-box;
    }

    /* --- GRIGLIA --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr); /* colonne uguali */
      grid-template-rows: repeat(5, 1fr); /* righe uguali */
      gap: 5px;
      width: 90vw;
      max-width: 500px;
      aspect-ratio: 1 / 1; /* griglia quadrata */
    }

    /* --- TILE --- */
    .tile {
      width: 100%;
      aspect-ratio: 1 / 1; /* altezza uguale alla larghezza */
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-radius: 8px;
      border: 2px solid #ccc;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
      font-size: clamp(12px, 2vw, 16px); /* testo scalabile */
      box-sizing: border-box;
      position: relative;
    }

      /* --- TILE ATTIVO --- */
      .tile.active {
        color: white;
      }

    /* --- MARK X --- */
    .xmark {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      color: black;
    }

    /* --- MEDIA QUERY PER MOBILE MOLTO PICCOLO --- */
    @media (max-width: 400px) {
      .grid {
        gap: 3px;
      }

      .tile {
        font-size: 10px;
      }

      button, input, select {
        font-size: 14px;
      }
    }
  </style>
</head>

  <!-- SCHERMATA IMPOSTAZIONI -->
  <div class="schermata" id="pannelloImpostazioni">
    <div class="container">
      <h1>Impostazioni</h1>
      <form>




        <div class="form-group" id="grandezza">
          <label id="lblgrandezza" for="grandezzagriglia">Grandezza Griglia</label>
          <select id="grandezzagriglia">
            <option value="9">PICCOLISSIMA (3x3)</option>
            <option value="16">PICCOLA (4x4)</option>
            <option value="25" selected>DEFAULT (5x5)</option>
            <option value="36">GRANDE (6x6)</option>
            <option value="49">GRANDISSIMA (7x7)</option>
          </select>
        </div>


        <div class="form-group" id="contenitoretipoparole">
          <label id="lbltipoparole" for="selezionatipoparole">SELEZIONA TIPO PAROLE</label>
          <select id="selezionatipoparole">

            <option value="NORMALI" selected>NORMALI</option>
            <option value="CALCIO">CALCIO</option>
            <option value="POKEMON">POKEMON</option>
          </select>
        </div>



        <div class="form-group" id="camponumeroparole1">
          <label for="numeroparole1">Numero Parole Squadra Iniziale</label>
          <input type="number" id="numeroparole1" name="numeroparole1"
                 step="1" value="9" required>
        </div>
        <div class="form-group" id="camponumeroparole2">
          <label for="numeroparole2">Numero ParoleSeconda Squadra (si consiglia 1 in meno della prima)</label>
          <input type="number" id="numeroparole2" name="numeroparole2"
                 step="1" value="8" required>
        </div>


        <div class="form-group" id="camponumeroparoleverdi">
          <label for="numeroparoleverdi">Numero Carte Verdi</label>
          <input type="number" id="numeroparoleverdi" name="numeroparoleverdi"
                 step="1" value="0" required>
        </div>

        <div class="form-group" id="camponunmeroparolenere">
          <label for="numeroparolenere">Numero Parole Nere</label>
          <input type="number" id="numeroparolenere" name="numeroparolenere"
                 step="1" value="1" required>
        </div>






        <div class="form-group" id="contenitoreruolo">
          <label id="lblruolo" for="selezionaruolo">Sei il capitano?</label>
          <select id="selezionaruolo">
            <option value="NESSUNASELEZIONE" selected>NESSUNA SELEZIONE</option>
            <option value="NO">NO</option>
            <option value="SI">SI</option>
          </select>
        </div>

        <div class="form-group" id="campoparola">
          <label for="parola">Inserisci Parola d'ordine</label>
          <input type="text" id="parola" name="parola"
                 oninput="this.value=this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase()" required>
        </div>
        <button id="bottoneAvanti" type="button">Avanti</button>
      </form>
    </div>
  </div>

    // HASH STRING → SEED
    function stringToSeed(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return hash >>> 0;
    }

    // PRNG deterministico
    function mulberry32(seed) {
      let m = 0x80000000;
      let a = 1103515245;
      let c = 12345;
      let state = seed % m;
      return function () {
        state = (a * state + c) % m;
        return state / m;
      }
    }

    // ESTRAE M ELEMENTI PSEUDOCASUALI
    function pickSeeded(list, m, password) {
      const seed = stringToSeed(password);
      const rand = mulberry32(seed);
      const arr = [...list];
      const result = [];
      for (let i = 0; i < m && arr.length > 0; i++) {
        const index = Math.floor(rand() * arr.length);
        result.push(arr[index]);
        arr.splice(index, 1);
      }
      return result;
    }

    function generaTessere(password) {
      const seed = stringToSeed(password);
      const rand = mulberry32(seed);

      // 1..25
      let numeri = Array.from({ length: dimensione }, (_, i) => i + 1);

      // mescola pseudocasuale
      for (let i = numeri.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [numeri[i], numeri[j]] = [numeri[j], numeri[i]];
      }
         
      // Dividi i numeri
      const gruppo1 = numeri.slice(0, parole1);  // 9 tessere
      const gruppo2 = numeri.slice(parole1, parole1 + parole2); // 8 tessere
      const gruppo3 = numeri.slice(parole1 + parole2, parole1 + parole2 + parolenere); // 1 tessera nera
    

      const gruppo5 = numeri.slice(
        parole1 + parole2 + parolenere,
        parole1 + parole2 + parolenere + paroleverdi
      );

      const gruppo4 = numeri.slice(
        parole1 + parole2 + parolenere + paroleverdi,
        dimensione
      );

      // Decide casualmente quale colore inizia
       primoColore = rand() < 0.5 ? 'blu' : 'rosso';
      const secondoColore = primoColore === 'blu' ? 'rosso' : 'blu';
 const gruppo1Color = Array(parole1).fill(secondoColore);
const gruppo2Color = Array(parole2).fill(primoColore);

      // Gruppo3 → nero
      const gruppo3Color = Array(parolenere).fill('nero');
      const gruppo5Color = Array(paroleverdi).fill('verde');
      // Gruppo4 → giallo
      const gruppo4Color = Array(parolegialle).fill('giallo');

      // Assegna colori agli indici
      const tessere = {};
      for (let i = 0; i < parole1; i++) { tessere[gruppo1[i]] = gruppo1Color[i]; }
      for (let i = 0; i < parole2; i++) { tessere[gruppo2[i]] = gruppo2Color[i]; }
      for (let i = 0; i < parolenere; i++) { tessere[gruppo3[i]] = 'nero'; }

      for (let i = 0; i < paroleverdi; i++) {
        tessere[gruppo5[i]] = 'verde';
      }

      for (let i = 0; i < parolegialle; i++) { tessere[gruppo4[i]] = 'giallo'; }

      return tessere; // oggetto {numero: colore}
    }
